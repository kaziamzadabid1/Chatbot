<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Claude Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e11;
      --surface: #17171c;
      --surface2: #1f1f26;
      --border: rgba(255,255,255,0.07);
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #888899;
      --user-bg: #2a2060;
      --bot-bg: #1f1f26;
      --radius: 18px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(124,106,247,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .status {
      margin-left: auto;
      font-size: 12px;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Welcome state */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      animation: fadeIn 0.6s ease;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .welcome h2 {
      font-size: 22px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .welcome p {
      font-size: 14px;
      max-width: 300px;
      line-height: 1.6;
    }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent2);
      background: rgba(124,106,247,0.08);
    }

    /* Messages */
    .msg {
      display: flex;
      gap: 12px;
      animation: slideUp 0.3s ease;
      max-width: 90%;
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg.bot {
      align-self: flex-start;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      margin-top: 2px;
    }

    .msg.bot .msg-avatar {
      background: linear-gradient(135deg, var(--accent), #c084fc);
    }

    .msg.user .msg-avatar {
      background: var(--user-bg);
      border: 1px solid rgba(124,106,247,0.3);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.6;
      max-width: 100%;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid rgba(124,106,247,0.2);
      border-bottom-right-radius: 6px;
    }

    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      padding: 16px 0 20px;
      flex-shrink: 0;
    }

    .input-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: rgba(124,106,247,0.5);
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      resize: none;
      min-height: 24px;
      max-height: 140px;
      line-height: 1.5;
      padding: 2px 0;
    }

    textarea::placeholder { color: var(--muted); }

    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      color: white;
    }

    #send-btn:hover { background: var(--accent2); transform: scale(1.05); }
    #send-btn:disabled { background: var(--surface2); cursor: not-allowed; transform: none; }

    #send-btn svg { width: 18px; height: 18px; }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
      opacity: 0.6;
    }

    /* Error toast */
    .error-toast {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      animation: slideUp 0.3s ease;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="avatar">✦</div>
    <div>
      <h1>Claude Assistant</h1>
    </div>
    <div class="status">Online</div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">✦</div>
      <h2>How can I help you?</h2>
      <p>Ask me anything — I'm powered by Claude AI and ready to assist.</p>
      <div class="suggestion-chips">
        <button class="chip" onclick="sendChip(this)">Explain something</button>
        <button class="chip" onclick="sendChip(this)">Write code for me</button>
        <button class="chip" onclick="sendChip(this)">Summarize a topic</button>
        <button class="chip" onclick="sendChip(this)">Give me ideas</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="msg" placeholder="Message Claude..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <p class="hint">Powered by Claude AI · Press Enter to send</p>
  </div>
</div>

<script>
  const history = [];
  const chatEl = document.getElementById("chat");
  const msgEl = document.getElementById("msg");
  const sendBtn = document.getElementById("send-btn");
  const welcome = document.getElementById("welcome");

  // Auto-resize textarea
  msgEl.addEventListener("input", () => {
    msgEl.style.height = "auto";
    msgEl.style.height = Math.min(msgEl.scrollHeight, 140) + "px";
  });

  msgEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendChip(btn) {
    msgEl.value = btn.textContent;
    sendMessage();
  }

  function addMessage(role, text) {
    if (welcome) welcome.style.display = "none";

    const div = document.createElement("div");
    div.className = `msg ${role}`;

    const avatarEl = document.createElement("div");
    avatarEl.className = "msg-avatar";
    avatarEl.textContent = role === "user" ? "You" : "✦";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    div.appendChild(avatarEl);
    div.appendChild(bubble);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.id = "typing";

    const avatarEl = document.createElement("div");
    avatarEl.className = "msg-avatar";
    avatarEl.textContent = "✦";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    div.appendChild(avatarEl);
    div.appendChild(bubble);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = msgEl.value.trim();
    if (!text || sendBtn.disabled) return;

    addMessage("user", text);
    history.push({ role: "user", content: text });
    msgEl.value = "";
    msgEl.style.height = "auto";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });

      const data = await res.json();
      removeTyping();

      if (data.error) {
        const errDiv = document.createElement("div");
        errDiv.className = "error-toast";
        errDiv.textContent = "⚠ " + data.error;
        chatEl.appendChild(errDiv);
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (err) {
      removeTyping();
      const errDiv = document.createElement("div");
      errDiv.className = "error-toast";
      errDiv.textContent = "⚠ Network error. Check your connection.";
      chatEl.appendChild(errDiv);
    }

    sendBtn.disabled = false;
    chatEl.scrollTop = chatEl.scrollHeight;
    msgEl.focus();
  }
</script>
</body>
</html>
